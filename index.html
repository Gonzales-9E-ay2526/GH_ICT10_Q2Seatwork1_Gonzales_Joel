<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Gaming Club</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');

        body {
            background: radial-gradient(circle at center, #121826 0%, #07090f 100%);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Animated background grid effect */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
        }

        form {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.05);
            border: 2px solid rgba(0, 255, 204, 0.4);
            text-align: center;
            width: 340px;
            position: relative;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: #00ffcc;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 16px;
            margin: 12px 0;
            background: #07090f;
            border: 2px solid #222b3d;
            border-radius: 8px;
            color: #00ffcc;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #4a5a75;
            font-weight: 500;
        }

        input[type="text"]:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            background: #0d121d;
        }

        input[type="button"] {
            background: linear-gradient(135deg, #00ffcc, #007acc);
            color: #07090f;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1px;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.4);
            transition: all 0.2s ease-in-out;
        }

        input[type="button"]:hover {
            background: linear-gradient(135deg, #33ffd6, #0099ff);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 255, 204, 0.6);
        }

        input[type="button"]:active {
            transform: translateY(1px);
        }

        #result {
            margin-top: 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            min-height: 30px;
        }
    </style>
</head>
<body>

    <form>
        <h1>⚡ Gaming Club ⚡</h1>
        <input type="text" id="first_name" placeholder="First Name"><br>
        <input type="text" id="last_name" placeholder="Last Name"><br>
        <input type="button" py-click="candidate_checker" value="Initialize Entry">
    </form>
    <div id="result"></div>

    <py-script src="main.py"></py-script>
</body>
</html>
